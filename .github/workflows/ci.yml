name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5435:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6381:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        env:
          JWT_SECRET: test-jwt-secret-that-is-at-least-32-bytes-long!
          ACCESS_TOKEN_EXPIRATION_MINUTES: 15
          REFRESH_TOKEN_EXPIRATION_HOURS: 720
          DB_HOST: localhost
          DB_PORT: 5435
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: auth_test
          REDIS_ADDR: localhost:6381
          REDIS_PASSWORD: ""
          REDIS_DB: 0
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: "5435"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: auth_test
          REDIS_ADDR: localhost:6381
        run: go test -v -tags=integration -race ./app/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Run Gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -conf .gosec.json -exclude-dir=internal/sqlcgen ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
